server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service-auth
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**
        - id: identity-service-users
          uri: lb://identity-service
          predicates:
            - Path=/api/users/**
        - id: customer-service-customers
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
        - id: customer-service-staffs
          uri: lb://customer-service
          predicates:
            - Path=/api/staffs/**
        - id: account-service-types
          uri: lb://account-service
          predicates:
            - Path=/api/account-types/**
        - id: account-service-accounts
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
